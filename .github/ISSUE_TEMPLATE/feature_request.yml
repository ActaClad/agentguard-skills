name: Feature request
description: Suggest something the skill should cover or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What were you trying to do, and where did the skill fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the agent should do instead.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Stack, coding agent, links to AgentGuard docs or SDK code.
